<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong - Sound + 2 Player</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --table: #0b1220;
      --paddle: #f8fafc;
      --ball: #fbbf24;
      --line: rgba(255,255,255,0.25);
      --text: #e5e7eb;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-shell {
      background: var(--panel);
      border: 3px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .mode-btn {
      background: #1f2937;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .mode-btn:hover {
      background: #2b3a4c;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #082f49;
      border-color: transparent;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      padding: 12px 0 8px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      background: rgba(255,255,255,0.02);
    }

    .score {
      min-width: 60px;
      text-align: center;
    }

    canvas {
      display: block;
      background: var(--table);
      width: 800px;
      height: 450px;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="top-bar">
      <button class="mode-btn active" data-mode="computer">Vs Computer</button>
      <button class="mode-btn" data-mode="two-player">Two Players</button>
    </div>

    <div class="scoreboard">
      <div id="leftScore" class="score">0</div>
      <div>:</div>
      <div id="rightScore" class="score">0</div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");
    const modeButtons = document.querySelectorAll(".mode-btn");

    const paddleWidth = 12;
    const paddleHeight = 90;
    const ballRadius = 8;
    const wallPadding = 10;

    let currentMode = "computer";

    const leftPaddle = {
      x: 30,
      y: canvas.height / 2 - 45,
      width: paddleWidth,
      height: paddleHeight,
      speed: 7
    };

    const rightPaddle = {
      x: canvas.width - 30 - paddleWidth,
      y: canvas.height / 2 - 45,
      width: paddleWidth,
      height: paddleHeight,
      speed: 7
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 5,
      vy: 3
    };

    const score = { left: 0, right: 0 };

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      w: false,
      s: false
    };

    // Sound system
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playTone(frequency, duration, volume, type = "sine", slide = 0) {
      ensureAudio();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      if (slide !== 0) {
        oscillator.frequency.linearRampToValueAtTime(
          frequency + slide,
          audioCtx.currentTime + duration
        );
      }

      gainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    }

    function playPaddleSound() {
      playTone(180, 0.08, 0.08, "square", 80);
    }

    function playWallSound() {
      playTone(120, 0.06, 0.05, "triangle", 30);
    }

    function playScoreSound() {
      playTone(440, 0.12, 0.08, "sawtooth", 100);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updateScore() {
      leftScoreEl.textContent = score.left;
      rightScoreEl.textContent = score.right;
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.2 - 0.6); // random between -0.6 and 0.6 rad
      const speed = 5.8;

      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function updateLeftPaddleFromKeys() {
      if (keys.ArrowUp) leftPaddle.y -= leftPaddle.speed;
      if (keys.ArrowDown) leftPaddle.y += leftPaddle.speed;

      leftPaddle.y = clamp(
        leftPaddle.y,
        wallPadding,
        canvas.height - leftPaddle.height - wallPadding
      );
    }

    function updateRightPaddle() {
      if (currentMode === "computer") {
        const targetY = ball.y - rightPaddle.height / 2;
        const followStrength = 0.11;
        rightPaddle.y += (targetY - rightPaddle.y) * followStrength;
      } else {
        if (keys.w) rightPaddle.y -= rightPaddle.speed;
        if (keys.s) rightPaddle.y += rightPaddle.speed;
      }

      rightPaddle.y = clamp(
        rightPaddle.y,
        wallPadding,
        canvas.height - rightPaddle.height - wallPadding
      );
    }

    function handleBallWallCollision() {
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
        playWallSound();
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
        playWallSound();
      }
    }

    function handlePaddleCollision(paddle, isLeft) {
      const withinX =
        ball.x + ball.radius > paddle.x &&
        ball.x - ball.radius < paddle.x + paddle.width;

      const withinY =
        ball.y + ball.radius > paddle.y &&
        ball.y - ball.radius < paddle.y + paddle.height;

      if (withinX && withinY) {
        const relativeHit = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const bounceAngle = relativeHit * (Math.PI / 3);
        const speed = Math.max(Math.hypot(ball.vx, ball.vy), 5) + 0.2;

        if (isLeft) {
          ball.x = paddle.x + paddle.width + ball.radius;
          ball.vx = Math.abs(Math.cos(bounceAngle) * speed);
        } else {
          ball.x = paddle.x - ball.radius;
          ball.vx = -Math.abs(Math.cos(bounceAngle) * speed);
        }

        ball.vy = Math.sin(bounceAngle) * speed;
        playPaddleSound();
      }
    }

    function checkScoring() {
      if (ball.x - ball.radius < 0) {
        score.right += 1;
        updateScore();
        playScoreSound();
        resetBall(1);
      }

      if (ball.x + ball.radius > canvas.width) {
        score.left += 1;
        updateScore();
        playScoreSound();
        resetBall(-1);
      }
    }

    function update() {
      updateLeftPaddleFromKeys();
      updateRightPaddle();

      ball.x += ball.vx;
      ball.y += ball.vy;

      handleBallWallCollision();
      handlePaddleCollision(leftPaddle, true);
      handlePaddleCollision(rightPaddle, false);
      checkScoring();
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Decorative center dots
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      for (let i = 0; i < canvas.height; i += 18) {
        ctx.fillRect(canvas.width / 2 - 2, i, 4, 10);
      }
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.fillStyle = "#fbbf24";
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      drawBackground();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Mode switching
    modeButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentMode = button.dataset.mode;
        modeButtons.forEach(btn => btn.classList.toggle("active", btn === button));

        // Reset ball direction depending on mode
        resetBall(Math.random() < 0.5 ? -1 : 1);
      });
    });

    // Mouse movement for left paddle
    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = ((event.clientY - rect.top) / rect.height) * canvas.height;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = clamp(
        leftPaddle.y,
        wallPadding,
        canvas.height - leftPaddle.height - wallPadding
      );
    });

    // Keyboard handlers
    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = true;
        event.preventDefault();
      }
      if (key === "w" || key === "s") {
        keys[key] = true;
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = false;
        event.preventDefault();
      }
      if (key === "w" || key === "s") {
        keys[key] = false;
        event.preventDefault();
      }
    });

    updateScore();
    resetBall(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
